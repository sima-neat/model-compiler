name: Manual Component Update Test

run-name: Test component updater from feature/daily-component-updates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report updates without pushing automation/component-updates
        type: boolean
        default: true

permissions:
  actions: write
  contents: write

jobs:
  update-components:
    uses: sima-neat/model-compiler/.github/workflows/update-components.yml@7878473a995c595b710b2c59a706f5bca4c61367
    with:
      dry_run: ${{ inputs.dry_run }}
      implementation_ref: 7878473a995c595b710b2c59a706f5bca4c61367
    secrets: inherit
