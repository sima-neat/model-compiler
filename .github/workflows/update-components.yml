name: Daily Component Update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report available updates without changing daily
        type: boolean
        default: false
      source_ref:
        description: Manifest ref for dry-run testing only
        type: string
        default: develop

permissions:
  actions: write
  contents: write

jobs:
  update:
    uses: sima-neat/model-compiler/.github/workflows/update-components.yml@develop
    with:
      dry_run: ${{ inputs.dry_run }}
      source_ref: ${{ inputs.source_ref }}
    secrets: inherit
