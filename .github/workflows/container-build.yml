name: Publish Branch Containers

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_call:
    inputs:
      source_branch:
        description: Branch whose package artifacts should be containerized
        required: true
        type: string
      source_sha:
        description: Commit whose package artifacts should be containerized
        required: true
        type: string
      source_run_id:
        description: Build workflow run containing the package artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: model-compiler-container-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.source_branch }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve successful branch build
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      eligible: ${{ steps.branch.outputs.eligible }}
      branch: ${{ steps.branch.outputs.branch }}
      image: ${{ steps.branch.outputs.image }}
      base_cache_image: ${{ steps.branch.outputs.base_cache_image }}
      sha: ${{ steps.branch.outputs.sha }}
      run_id: ${{ steps.branch.outputs.run_id }}
    steps:
      - name: Verify branch still points to the successful commit
        id: branch
        uses: actions/github-script@v8
        env:
          SOURCE_BRANCH: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || inputs.source_branch }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
        with:
          script: |
            const branch = String(process.env.SOURCE_BRANCH || '').trim();
            const sha = String(process.env.SOURCE_SHA || '').trim();
            const runId = String(process.env.SOURCE_RUN_ID || '').trim();
            if (!branch || !/^[0-9a-f]{40}$/.test(sha) || !/^\d+$/.test(runId)) {
              core.info('The triggering run has no valid branch, commit, or run ID; skipping.');
              core.setOutput('eligible', 'false');
              return;
            }

            let branchRef;
            try {
              branchRef = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch ${branch} no longer exists; skipping publication.`);
                core.setOutput('eligible', 'false');
                return;
              }
              throw error;
            }

            if (branchRef.data.object.sha !== sha) {
              core.info(`Branch ${branch} advanced beyond ${sha}; skipping stale publication.`);
              core.setOutput('eligible', 'false');
              return;
            }

            const crypto = require('crypto');
            function packageForBranch(branchName) {
              const hash = crypto.createHash('sha256')
                .update(branchName, 'utf8')
                .digest('hex')
                .slice(0, 12);
              let slug = branchName.toLowerCase()
                .replace(/[^a-z0-9._-]+/g, '-')
                .replace(/^[^a-z0-9]+/, '')
                .replace(/[^a-z0-9]+$/, '')
                .replace(/-{2,}/g, '-')
                .slice(0, 180)
                .replace(/[^a-z0-9]+$/, '');
              if (!slug) {
                slug = 'branch';
              }
              return `model-compiler-${slug}-${hash}`;
            }

            const packageName = packageForBranch(branch);
            const developPackageName = packageForBranch('develop');
            const owner = context.repo.owner.toLowerCase();
            core.setOutput('eligible', 'true');
            core.setOutput('branch', branch);
            core.setOutput('image', `ghcr.io/${owner}/${packageName}`);
            core.setOutput('base_cache_image', `ghcr.io/${owner}/${developPackageName}`);
            core.setOutput('sha', sha);
            core.setOutput('run_id', runId);

  build:
    name: Build and publish ${{ matrix.arch }} image
    if: needs.prepare.outputs.eligible == 'true'
    needs: prepare
    permissions:
      actions: read
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out successful source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Model Compiler bundle
        uses: actions/download-artifact@v7
        with:
          name: model-compiler-${{ matrix.arch }}
          path: _package
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Model Compiler bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          archive="_package/model-compiler-${ARCH}.zip"
          test -f "${archive}"
          mkdir -p _bundle
          unzip -oq "${archive}" -d _bundle
          test -f _bundle/install_modelsdk_wheels.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and smoke-test container
        env:
          BUILDX_CACHE_FROM: ${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }} ${{ needs.prepare.outputs.base_cache_image }}:buildcache-${{ matrix.arch }}
          BUILDX_CACHE_TO: ${{ needs.prepare.outputs.image }}:buildcache-${{ matrix.arch }}
          MODELSDK_CONTAINER_GIT_BRANCH: ${{ needs.prepare.outputs.branch }}
          MODELSDK_CONTAINER_GIT_HASH: ${{ needs.prepare.outputs.sha }}
          MODELSDK_CONTAINER_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/build_modelsdk_container.sh \
            --target-arch "${{ matrix.arch }}" \
            --bundle-dir _bundle \
            --image "model-compiler:ci-${{ matrix.arch }}" \
            --smoke-test

      - name: Publish architecture image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker tag "model-compiler:ci-${ARCH}" "${IMAGE}:${SHA}-${ARCH}"
          docker push "${IMAGE}:${SHA}-${ARCH}"

  manifest:
    name: Publish multi-architecture manifest
    if: needs.prepare.outputs.eligible == 'true'
    needs:
      - prepare
      - build
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and publish manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHA}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${SHA}-amd64" \
            "${IMAGE}:${SHA}-arm64"
