name: Daily Component Update

run-name: Check source.json component families for newer builds

on:
  workflow_call:
    inputs:
      channel:
        type: string
        default: develop
      rebuild_unchanged:
        description: Build even when the automation candidate is unchanged
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
      source_ref:
        type: string
        default: develop

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: model-compiler-component-updates-${{ inputs.channel }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve-vulcan-config:
    uses: sima-neat/.github/.github/workflows/vulcan-resolve-config.yml@main
    with:
      vulcan_env: ${{ vars.VULCAN_ENV || 'production' }}

  resolve-source:
    name: Resolve develop source commit
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Validate source selection
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'develop' }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          case "${CHANNEL}" in develop|master) ;; *) exit 1 ;; esac
          if [[ "${SOURCE_REF}" != "develop" && "${DRY_RUN}" != "true" ]]; then
            echo "A custom source_ref requires dry_run=true." >&2
            exit 1
          fi

      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || 'develop' }}
          clean: true

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  scan:
    name: Scan ARM64 component artifacts
    needs: [resolve-source, resolve-vulcan-config]
    environment: ${{ vars.VULCAN_ENV || 'production' }}
    runs-on:
      - self-hosted
      - macOS
      - ARM64
      - osx

    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          clean: true

      - name: Checkout updater implementation
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          path: _component-updater

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python3 -m pip install --upgrade pip

      - name: Apply checked-in component channel policy
        env:
          COMPONENT_CHANNEL: ${{ inputs.channel }}
        run: python3 _component-updater/scripts/component_channel.py prepare --channel "${COMPONENT_CHANNEL}" --source-json scripts/source.json

      - name: Scan compatible component builds
        run: |
          set -euo pipefail
          python3 _component-updater/scripts/update_component_versions.py scan \
            --source-json scripts/source.json \
            --target-arch aarch64 --newest-only \
            --output scan-aarch64.json

      - name: Prepare private upstream comparison
        env:
          BASELINE_SHA: ${{ needs.resolve-source.outputs.sha }}
          PRIVATE_DIR: ${{ runner.temp }}/upstream-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "${PRIVATE_DIR}"
          chmod 700 "${PRIVATE_DIR}"
          git show HEAD:scripts/source.json > "${PRIVATE_DIR}/baseline.json"
          python3 _component-updater/scripts/update_component_versions.py merge \
            --source-json scripts/source.json --report scan-aarch64.json \
            --output "${PRIVATE_DIR}/resolved.json" --summary "${PRIVATE_DIR}/versions.md"
          python3 _component-updater/scripts/component_channel.py validate --source-json "${PRIVATE_DIR}/resolved.json"

      - name: Configure private Vulcan history access
        if: vars.UPSTREAM_CHANGELOG_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.resolve-vulcan-config.outputs.artifact_publisher_role_arn }}
          aws-region: ${{ needs.resolve-vulcan-config.outputs.aws_region }}

      - name: Install private history client
        if: vars.UPSTREAM_CHANGELOG_ENABLED == 'true'
        run: python3 -m pip install awscli

      - name: Restore private upstream history
        if: vars.UPSTREAM_CHANGELOG_ENABLED == 'true'
        env:
          HISTORY_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          HISTORY_KMS_KEY: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          PRIVATE_DIR: ${{ runner.temp }}/upstream-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 _component-updater/scripts/private_changelog_cache.py download \
            --bucket "${HISTORY_BUCKET}" --directory "${PRIVATE_DIR}/history" --kms-key "${HISTORY_KMS_KEY}"

      - name: Collect private upstream changes
        env:
          JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          BASELINE_SHA: ${{ needs.resolve-source.outputs.sha }}
          PRIVATE_DIR: ${{ runner.temp }}/upstream-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 _component-updater/scripts/upstream_changes.py \
            --base "${PRIVATE_DIR}/baseline.json" --updated "${PRIVATE_DIR}/resolved.json" \
            --base-sha "${BASELINE_SHA}" --cache "${PRIVATE_DIR}/history" --output "${PRIVATE_DIR}/report"

      - name: Retain private upstream history
        if: vars.UPSTREAM_CHANGELOG_ENABLED == 'true' && !inputs.dry_run
        env:
          HISTORY_BUCKET: ${{ needs.resolve-vulcan-config.outputs.artifact_bucket }}
          HISTORY_KMS_KEY: ${{ needs.resolve-vulcan-config.outputs.artifact_kms_key_id }}
          PRIVATE_DIR: ${{ runner.temp }}/upstream-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 _component-updater/scripts/private_changelog_cache.py upload \
            --bucket "${HISTORY_BUCKET}" --directory "${PRIVATE_DIR}/history" --kms-key "${HISTORY_KMS_KEY}"

      - name: Remove private upstream files
        if: always()
        env:
          PRIVATE_DIR: ${{ runner.temp }}/upstream-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "${PRIVATE_DIR}"

      - name: Upload scan report
        uses: actions/upload-artifact@v7
        with:
          name: component-scan-${{ inputs.channel }}-aarch64
          path: scan-aarch64.json
          if-no-files-found: error
          retention-days: 3

  prepare-update:
    name: Prepare source.json update
    needs:
      - resolve-source
      - scan
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.merge.outputs.changed }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          clean: true
          fetch-depth: 0

      - name: Checkout updater implementation
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-source.outputs.sha }}
          path: _component-updater

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download architecture scan reports
        uses: actions/download-artifact@v7
        with:
          name: component-scan-${{ inputs.channel }}-aarch64
          path: _component-scans

      - name: Apply checked-in component channel policy
        env:
          COMPONENT_CHANNEL: ${{ inputs.channel }}
        run: python3 _component-updater/scripts/component_channel.py prepare --channel "${COMPONENT_CHANNEL}" --source-json scripts/source.json

      - name: Merge compatible versions
        id: merge
        run: |
          set -euo pipefail
          python3 _component-updater/scripts/update_component_versions.py merge \
            --source-json scripts/source.json \
            --report _component-scans/scan-aarch64.json \
            --output "${RUNNER_TEMP}/source.json" \
            --summary "${RUNNER_TEMP}/component-update-summary.md" \
            --github-output "${GITHUB_OUTPUT}"
          python3 _component-updater/scripts/component_channel.py validate --source-json "${RUNNER_TEMP}/source.json"
          cp "${RUNNER_TEMP}/source.json" scripts/source.json
          cat "${RUNNER_TEMP}/component-update-summary.md" >> "${GITHUB_STEP_SUMMARY}"
          python3 -m json.tool scripts/source.json >/dev/null
          python3 -m unittest discover -s _component-updater/tests -p 'test*component*.py' -v

      - name: Show dry-run diff
        if: steps.merge.outputs.changed == 'true' && inputs.dry_run
        run: git diff -- scripts/source.json

      - name: Create GitHub App token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.NEAT_RELEASES_APP_ID }}
          private-key: ${{ secrets.NEAT_RELEASES_APP_PRIVATE_KEY }}

      - name: Refresh stable automation branch
        id: refresh
        if: ${{ !inputs.dry_run }}
        env:
          DAILY_BRANCH: ${{ inputs.channel == 'master' && 'daily-master' || 'daily' }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: |
          set -euo pipefail

          # checkout@v5 persists GITHUB_TOKEN in this header. Replace it for
          # this process so the App-authenticated push triggers Build.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0=
          export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_APP_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_VALUE_1
          echo "::add-mask::${GIT_CONFIG_VALUE_1}"
          bash _component-updater/scripts/refresh_daily_branch.sh

      - name: Rebuild unchanged scheduled candidate
        if: ${{ !inputs.dry_run && inputs.rebuild_unchanged && steps.refresh.outputs.changed == 'false' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DAILY_BRANCH: ${{ inputs.channel == 'master' && 'daily-master' || 'daily' }}
        run: gh workflow run build.yml --repo "${GITHUB_REPOSITORY}" --ref "${DAILY_BRANCH}"

      - name: Report no changes
        if: steps.merge.outputs.changed != 'true'
        run: echo "No newer component builds matched the update policy." >> "${GITHUB_STEP_SUMMARY}"
